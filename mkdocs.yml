site_name: Clean IoC
site_description: Typed Python dependency injection with build-time component compilation, immutable runtime plans, explicit lifespans, generics, decorators, and FastAPI scopes.
site_author: Peter Daly
site_url: https://peter-daly.github.io/clean_ioc/
repo_name: peter-daly/clean_ioc
repo_url: https://github.com/peter-daly/clean_ioc
edit_uri: edit/main/docs/
nav:
  - Home: index.md
  - Design rationale: why-clean-ioc.md
  - Build & Components: validation.md
  - Compiler Tooling: compiler-tooling.md
  - Registration: simple-uses.md
  - Factories: factories.md
  - Lifespans: lifespans.md
  - Generics: generics.md
  - Decorators: decorators.md
  - Scopes: scopes.md
  - Pre-Configurations: pre-configurations.md
  - Bundles: bundles.md
  - Advanced:
      - Filtering: advanced/filtering.md
      - Argument Policies: advanced/arguments.md
      - Special Dependency Types: advanced/special-dependency-types.md
      - Runtime container access: advanced/accessing-clean-ioc-within-dependency.md
  - Extensions:
    - FastAPI: extensions/fastapi.md
    - Potential future integrations: future-integrations.md
  - Examples:
    - FastAPI Clean Architecture: examples/clean-architecture.md
  - Benchmarks: benchmarks.md
  - Concepts:
    - Inversion of Control: inversion-of-control.md
    - Dependency Injection: dependency-injection.md
    - Dependency boundaries: solid.md

theme:
  name: material
  features:
    - content.code.copy
    - content.action.edit
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
plugins:
  - autorefs
  - glightbox
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_symbol_type_toc: true
            show_if_no_docstring: true
          rendering:
            show_source: true

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - md_in_html

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - assets/javascripts/mermaid-init.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/peter-daly/clean_ioc
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/clean-ioc/
